[package]
name = "tf2-demo-comms-injector"
version = "0.1.0"
edition = "2021"
description = "Inject external audio into TF2 demo files as Steam voice chat"
license = "MIT"
rust-version = "1.88.0"
default-run = "inject-comms"

[lib]
name = "tf2_demo_comms_injector"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "inject-comms"
path = "src/bin/inject_comms.rs"
required-features = ["cli"]

[[bin]]
name = "inspect-demo"
path = "src/bin/inspect_demo.rs"
required-features = ["cli"]

[[bin]]
name = "extract-voice"
path = "src/bin/extract_voice.rs"
required-features = ["cli", "extract"]

[[bin]]
name = "dump-events"
path = "src/bin/dump_events.rs"
required-features = ["cli"]

[features]
default = ["native-opus", "extract", "cli"]
# libopus FFI (native CLI / tests). Preferred when available.
native-opus = ["dep:opus"]
# Pure-Rust Opus for browser WASM (no C toolchain).
wasm-opus = ["dep:rusty-opus"]
# Voice extract / decode round-trips (needs steam-audio-codec → native opus).
extract = ["dep:steam-audio-codec"]
# CLI binaries (clap).
cli = ["dep:clap"]
# Browser WASM bindings.
wasm = [
    "wasm-opus",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:getrandom",
]

[dependencies]
anyhow = "1.0"
bitbuffer = "0.11"
clap = { version = "=4.5.23", features = ["derive"], optional = true }
hound = "3.5"
opus = { version = "0.3", optional = true }
rusty-opus = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
steam-audio-codec = { version = "0.1.1", optional = true }
# crates.io 0.6.4 lacks the `write` feature; pin a vendored upstream snapshot.
tf-demo-parser = { path = "vendor/tf-demo-parser", features = ["write"] }
thiserror = "2.0"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# rusty-opus / wasm entropy; getrandom needs the js feature on wasm32.
getrandom = { version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
tempfile = "3.14"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-mutable-globals"]
